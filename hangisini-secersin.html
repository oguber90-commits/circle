<body style="--acc:#1C8B9C"><a class="home" href="index.html">&larr; Circle</a><div class="tag">SOHBET</div><h1>Hangisini seçersin</h1><p class="lede">İki seçenek açılır. Masadaki herkes sırayla birini seçer ve nedenini söyler. Pas geçmek yok.</p><button class="pick" id="btn">Yeni ikilem</button><div id="kutu" style="display:none;margin-top:22px"><div style="padding:24px 20px;border-radius:14px;background:rgba(246,241,228,.07);border:1px solid rgba(246,241,228,.16);font-size:21px;line-height:1.35" id="a"></div><div style="text-align:center;font-size:12px;letter-spacing:.2em;opacity:.45;padding:12px 0">YA DA</div><div style="padding:24px 20px;border-radius:14px;background:rgba(246,241,228,.07);border:1px solid rgba(246,241,228,.16);font-size:21px;line-height:1.35" id="b"></div></div><script>const P=[["Geçmişe bir kez gidebilmek", "Geleceği bir kez görebilmek"], ["Herkesin yalanını anlamak", "Kimsenin senin yalanını anlamaması"], ["Ömür boyu tek bir şarkı dinlemek", "Ömür boyu hiç müzik dinlememek"], ["Bir anda çok zengin olup arkadaşlarını kaybetmek", "Hep bu gelirle kalıp çevreni korumak"], ["Her gece on dakika uçabilmek", "Her gün istediğin yere ışınlanmak ama kimseye söyleyememek"], ["Tüm dillerde konuşabilmek", "Tüm hayvanlarla konuşabilmek"], ["Sonsuza kadar otuz yaşında kalmak", "Her yıl bir yaş gençleşmek"], ["Hiç utanmamak", "Hiç korkmamak"], ["Bir yıl internetsiz yaşamak", "Bir yıl evden hiç çıkmamak"], ["Herkesin seni sevdiği ama kimsenin tanımadığı biri olmak", "Herkesin tanıdığı ama yarısının nefret ettiği biri olmak"], ["Çok yakın beş arkadaş", "Her yerde iki yüz tanıdık"], ["Yaptığın her işte iyi olmak ama hiçbirini sevmemek", "Tek bir işi çok sevip ortalama olmak"], ["Zamanı durdurabilmek", "Zamanı geri alabilmek"], ["Yemeklerin tadını hiç alamamak", "Hiç müzik duyamamak"], ["Düşüncelerinin ekrana yansıması", "Konuştuğun her şeyin kayıt altına alınması"], ["Her sabah bilmediğin bir şehirde uyanmak", "Her sabah tam aynı günü yaşamak"], ["Çocukluğuna dönüp her şeyi hatırlamak", "On yıl ileri gidip hiçbir şey hatırlamamak"], ["Asla yalan söyleyememek", "Asla soru soramamak"], ["Hiç çalışmadan geçinmek ama bir amacın olmaması", "Çok çalışıp sevdiğin bir iş yapmak"], ["Telefonundaki her şeyi ailene göstermek", "Telefonundaki her şeyi iş yerine göstermek"], ["Her gün bir saatini tanımadığın biriyle geçirmek", "Her gün bir saatini tamamen yalnız geçirmek"], ["Uykuya hiç ihtiyaç duymamak", "Yemeğe hiç ihtiyaç duymamak"], ["Hayatının filmi çekilsin, herkes izlesin", "Hiç kimse senin hikâyeni bilmesin"], ["Bir anını sonsuz tekrar yaşamak", "Hiçbir anı hatırlamamak"], ["Dünyanın her yerine gidebilmek ama hiç geri dönememek", "Hiç seyahat edememek ama istediğin herkesi yanına çağırabilmek"], ["Kusursuz hafıza", "Kusursuz sezgi"], ["Herkes senin yaşını bilsin", "Herkes senin maaşını bilsin"], ["Sürekli çok sıcak bir yerde yaşamak", "Sürekli çok soğuk bir yerde yaşamak"], ["İnternette hiç iz bırakmamak", "İnternette her şeyinin bulunabilmesi"], ["Her kavgayı kazanmak ama haklı olmamak", "Hep haklı olmak ama kimseyi ikna edememek"], ["Çok komik olmak", "Çok akıllı olmak"], ["Bir hafta boyunca kimseyle konuşmamak", "Bir hafta boyunca hiç yalnız kalmamak"], ["Sevdiğin işi bırakıp çok para kazanmak", "Aynı işte kalıp yarı para kazanmak"], ["Rüyalarını kontrol edebilmek", "Uyandığında rüyanı hatırlayabilmek"], ["Her yediğin tat sürpriz olsun", "Her yediğinin tadı aynı olsun"], ["Bir insanı affedebilmek", "Bir insan tarafından affedilmek"], ["Hayatının geri kalanında sadece okumak", "Hayatının geri kalanında sadece seyahat etmek"], ["Hiç hastalanmamak", "Hiç yaşlanmamak"], ["Aklından geçeni herkese söylemek zorunda kalmak", "Hiç konuşamamak"], ["Kaybettiğin bir şeyi geri almak", "Hiç sahip olmadığın bir şeyi kazanmak"], ["Bir yıl boyunca her gün yeni bir insanla tanışmak", "Bir yıl boyunca her gün aynı beş kişiyle olmak"], ["Yaptığın her hatayı unutmak", "Yaptığın her iyiliği unutmak"], ["Çok iyi bir dinleyici olmak", "Çok iyi bir anlatıcı olmak"], ["İstediğin her yeteneği bir günlüğüne kazanmak", "Bir yeteneği ömür boyu ortalama seviyede tutmak"], ["Geçmişteki bir kararını değiştirmek", "Gelecekteki bir kararını önceden bilmek"], ["Herkesin seni olduğundan iyi sanması", "Herkesin seni olduğundan kötü sanması"], ["Hayatın boyunca hiç taşınmamak", "Her iki yılda bir şehir değiştirmek"], ["Sessiz ama huzurlu bir hayat", "Gürültülü ama heyecanlı bir hayat"]];

</script>
