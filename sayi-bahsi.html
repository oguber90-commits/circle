<body style="--acc:#6F65C9"><a class="home" href="index.html">&larr; Circle</a><div class="tag">BLÖF</div><h1>Sayı bahsi</h1><p class="lede">Soruyu açın, herkes bir tahmin yazsın. Tahminler küçükten büyüğe sıralanınca bahisler konur, sonra doğru cevabı açın. Telefonu tutan kişi de oynayabilir.</p><button class="pick" id="btn">Yeni soru</button><div id="out" style="display:block;margin-top:22px;padding:26px 20px;text-align:center"><div id="soru" style="font-size:22px;font-weight:600;line-height:1.3">&nbsp;</div><div id="cvp" style="margin-top:16px;font-size:34px;font-weight:650"></div></div><script>const Q=[["İnsan vücudunda kaç kemik vardır?", "206"], ["Türkiye'de kaç il vardır?", "81"], ["Satranç tahtasında kaç kare vardır?", "64"], ["Bir piyanoda kaç tuş vardır?", "88"], ["Bir yetişkinde kaç diş bulunur?", "32"], ["Türk alfabesinde kaç harf vardır?", "29"], ["Bir iskambil destesinde kaç kart vardır?", "52"], ["Everest kaç metredir?", "8.849"], ["Maraton kaç kilometredir?", "42,195"], ["Ay'a kaç insan ayak bastı?", "12"], ["Rubik küpünün yüzeyinde kaç küçük kare vardır?", "54"], ["Basketbol potası kaç metre yüksektedir?", "3,05"], ["Bir günde kaç saniye vardır?", "86.400"], ["Nil Nehri yaklaşık kaç kilometredir?", "6.650"], ["Birleşmiş Milletler'in kaç üyesi vardır?", "193"], ["Dünya'nın çapı yaklaşık kaç kilometredir?", "12.742"], ["Titanik hangi yıl battı?", "1912"], ["Bir futbol sahasında kaç oyuncu bulunur, iki takım toplam?", "22"], ["İnsan kalbi dakikada ortalama kaç kez atar?", "70"], ["Bir oktavda kaç beyaz tuş vardır?", "7"], ["Ayasofya hangi yüzyılda yapıldı?", "6."], ["Bir zarın karşılıklı yüzlerinin toplamı kaçtır?", "7"], ["Güneş ışığı Dünya'ya kaç dakikada ulaşır?", "8"], ["Bir insanın vücudunun yüzde kaçı sudur?", "60"], ["Olimpiyat bayrağında kaç halka vardır?", "5"], ["Bir asırda kaç on yıl vardır?", "10"], ["Kediler günde ortalama kaç saat uyur?", "15"], ["Bir salyangozun kaç dişi olabilir?", "binlerce"], ["Pi sayısının ilk üç basamağı nedir?", "3,14"], ["Türkiye kaç ülkeyle kara sınırı paylaşır?", "8"]];
let i=-1,acik=false;const d=document;
function bas(){
 if(i<0||acik){i=Math.floor(Math.random()*Q.length);acik=false;
  d.getElementById("soru").textContent=Q[i][0];d.getElementById("cvp").textContent="";
  d.getElementById("btn").textContent="Doğru cevabı göster";return;}
 d.getElementById("cvp").textContent=Q[i][1];acik=true;
 d.getElementById("btn").textContent="Yeni soru";}
d.addEventListener("DOMContentLoaded",()=>{d.getElementById("btn").onclick=bas;});
</script>
