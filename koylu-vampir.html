<body style="--acc:#6F65C9"><style>

.kisi.secili{border-color:var(--acc);background:rgba(28,139,156,.22)}

     letter-spacing:.08em;background:rgba(246,241,228,.1);border:1px solid rgba(246,241,228,.2)}

</style><a class="home" href="index.html">&larr; Circle</a><div class="tag">TAHMİN</div><h1>Köylü ve vampir</h1><p class="lede">Her şey telefondan döner: roller dağıtılır, gece vampirler kurbanını seçer, gündüz masa oy verip birini idam eder. Yedi kişiden sonra iki, on birden sonra üç vampir olur.</p><div id="giris"><input id="ad" placeholder="Adın" maxlength="18" style="margin-top:22px"><button class="pick" id="kur">Oda kur</button><div class="satir" style="margin-top:10px"><input id="kodgir" placeholder="ODA KODU" maxlength="4" style="text-transform:uppercase"><button class="pick" id="katil">Katıl</button></div></div><div id="oyun" hidden><div class="bar"><span>ODA <b id="kodgoster"></b></span><span id="lobiSay"></span></div><div id="lobi"><h2>ODADAKİLER</h2><ul id="lobiListe"></ul><button class="pick" id="baslat" hidden>Oyunu başlat</button></div><div id="masa" hidden><div id="rol" class="rolet"></div><div id="arkadas" class="ark" hidden></div><div class="fazbar"><span class="f" id="faz"></span><span class="s" id="sayac" hidden></span></div><div class="msj" id="mesaj"></div><h2 id="oyBaslik"></h2><div class="oyl" id="oylar"></div><div class="ilerleme" id="ilerleme"></div><div id="bitti" class="son" hidden></div><button class="pick" id="yeniden" hidden>Yeni oyun</button><div id="olenBlok" hidden><h2>ÖLENLER</h2><ul id="olenler"></ul></div></div><button class="pick ikincil" id="cik" style="margin-top:26px">Odadan çık</button></div><script>
const API = "https://circle-oda.oguber-90.workers.dev";
const g = i => document.getElementById(i);
let kod=null, ben=null, zaman=null, durum=null;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function api(yol, govde){
  const o = govde ? {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(govde)} : {};
  const r = await fetch(API+'/api'+yol, o); if(!r.ok) throw new Error(r.status); return r.json();
}
function adAl(){const a=g('ad').value.trim(); if(!a){g('ad').focus(); return null;}
  localStorage.setItem('circle_ad',a); return a;}
async function kur(){const a=adAl(); if(!a)return; const r=await api('/oda',{ad:a}); basla(r.kod,r.id);}
async function katil(){const a=adAl(); if(!a)return;
  const k=g('kodgir').value.trim().toUpperCase(); if(k.length!==4){g('kodgir').focus();return;}
  try{const r=await api('/oda/'+k+'/katil',{ad:a}); basla(k,r.id);}
  catch(e){g('kodgir').value=''; g('kodgir').placeholder='ODA BULUNAMADI';}}
function basla(k,id){kod=k; ben=id;
  sessionStorage.setItem('circle_vampir', k+'|'+id);
  g('giris').hidden=true; g('oyun').hidden=false; g('kodgoster').textContent=k;
  tazele(); clearInterval(zaman); zaman=setInterval(tazele,1500);}
function cik(){clearInterval(zaman); kod=null; ben=null;
  sessionStorage.removeItem('circle_vampir');
  g('oyun').hidden=true; g('giris').hidden=false;}
async function tazele(){
  let d; try{ d = await api('/oda/'+kod+'/vdurum',{id:ben}); }catch(e){ return; }
  durum = d; ciz(d);
}
function dk(sn){const m=Math.floor(sn/60), s=sn%60; return m+':'+String(s).padStart(2,'0');}
function ciz(d){
  const lobi = !d.oyunVar;
  g('lobi').hidden = !lobi;
  g('masa').hidden = lobi;
  if(lobi){
    api('/oda/'+kod+'?id='+encodeURIComponent(ben)).then(x=>{
      g('lobiListe').innerHTML = x.oyuncular.map(o=>'<li>'+esc(o.ad)+'</li>').join('');
      g('lobiSay').textContent = x.kisi + ' kişi';
      g('baslat').hidden = !(x.sahip);
    }).catch(()=>{});
    return;
  }
  const faz = d.faz==='gece' ? 'GECE' : (d.faz==='gunduz' ? 'GÜNDÜZ' : 'BİTTİ');
  g('faz').textContent = faz + (d.faz!=='bitti' ? ' · ' + d.tur + '. tur' : '');
  g('mesaj').textContent = d.mesaj || '';
  g('rol').textContent = d.rol === 'vampir' ? 'SEN VAMPİRSİN' : 'SEN KÖYLÜSÜN';
  g('rol').className = 'rolet ' + (d.rol==='vampir' ? 'kirmizi' : 'yesil');
  g('arkadas').hidden = !(d.rol==='vampir' && d.arkadaslar.length);
  if(d.arkadaslar.length) g('arkadas').textContent = 'Diğer vampir' +
    (d.arkadaslar.length>1?'ler':'') + ': ' + d.arkadaslar.join(', ');
  g('sayac').hidden = d.kalanSn === null;
  if(d.kalanSn !== null) g('sayac').textContent = dk(d.kalanSn);

  const oyVerebilir = d.yasiyorum && d.faz!=='bitti' &&
    (d.faz==='gunduz' || d.rol==='vampir');
  g('oyBaslik').textContent = d.faz==='gece'
    ? (d.rol==='vampir' ? 'KİMİ ÖLDÜRECEKSİNİZ' : 'VAMPİRLER SEÇİYOR, BEKLE')
    : (d.faz==='gunduz' ? 'KİMİ İDAM EDELİM' : 'OYUN BİTTİ');
  g('oylar').innerHTML = d.faz==='bitti' ? '' : d.yasayan.map(o =>
    '<button class="kisi'+(d.oyum===o.id?' secili':'')+'" data-h="'+o.id+'"'+
    (oyVerebilir?'':' disabled')+'>'+esc(o.ad)+
    (o.oyVerdi && d.faz==='gunduz' ? '<span class="tik">oy verdi</span>' : '')+'</button>').join('');
  g('ilerleme').textContent = d.faz==='bitti' ? '' : d.oySayisi + ' / ' + d.gereken + ' oy';
  g('olenler').innerHTML = d.olenler.map(o =>
    '<li>'+esc(o.ad)+' <span class="kucuk">'+(o.rol==='vampir'?'vampir':'köylü')+'</span></li>').join('');
  g('olenBlok').hidden = !d.olenler.length;
  g('bitti').hidden = d.faz!=='bitti';
  if(d.faz==='bitti') g('bitti').textContent = d.sonuc==='vampir' ? 'VAMPİRLER KAZANDI' : 'KÖYLÜLER KAZANDI';
  g('yeniden').hidden = !(d.sahip && d.faz==='bitti');
  if(!d.yasiyorum) g('oyBaslik').textContent = 'ÖLDÜN, İZLİYORSUN';
}
document.addEventListener('DOMContentLoaded',()=>{
  g('ad').value = localStorage.getItem('circle_ad') || '';
  g('kur').onclick=kur; g('katil').onclick=katil; g('cik').onclick=cik;
  g('baslat').onclick=async()=>{ await api('/oda/'+kod+'/vampir',{id:ben}); tazele(); };
  g('yeniden').onclick=async()=>{ await api('/oda/'+kod+'/vampir',{id:ben}); tazele(); };
  g('oylar').onclick=async e=>{ const b=e.target.closest('[data-h]'); if(!b||b.disabled) return;
    b.disabled=true; try{ await api('/oda/'+kod+'/voy',{id:ben,hedef:b.dataset.h}); }catch(err){}
    tazele(); };
  const kay=(sessionStorage.getItem('circle_vampir')||'').split('|');
  if(kay.length===2 && kay[0]) basla(kay[0],kay[1]);
});
</script>
