<!doctype html><html lang="tr"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111A24">
<title>Cevabını yaz · Circle</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111A24;--cream:#F6F1E4;--acc:#1C8B9C}
body{background:var(--ink);color:var(--cream);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     -webkit-font-smoothing:antialiased;padding:28px 20px 72px;max-width:720px;margin:0 auto}
a{color:inherit}
.home{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.22em;
      opacity:.55;text-decoration:none}
.home:hover{opacity:1}
.tag{display:block;margin-top:26px;font-size:11px;letter-spacing:.2em;
     color:var(--acc);font-weight:600}
h1{font-size:clamp(28px,8vw,40px);line-height:1.08;letter-spacing:-.02em;font-weight:650;margin-top:10px}
.lede{margin-top:14px;opacity:.72;max-width:46ch}
.pick{width:100%;margin-top:26px;padding:16px;border:0;border-radius:14px;background:var(--acc);
      color:#0B1118;font:inherit;font-weight:650;letter-spacing:.01em;cursor:pointer}
.pick:active{transform:translateY(1px)}
#out{display:none;margin-top:16px;padding:20px;border-radius:14px;background:rgba(246,241,228,.07);
     border:1px solid rgba(246,241,228,.16);font-size:20px;line-height:1.35}
h2{margin-top:40px;font-size:12px;letter-spacing:.2em;opacity:.5;font-weight:600}
ul{list-style:none;margin-top:12px}
li{padding:12px 0;border-bottom:1px solid rgba(246,241,228,.11)}
li:last-child{border-bottom:0}
b{font-weight:650;color:#fff}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid rgba(246,241,228,.12);font-size:12px;
      letter-spacing:.2em;opacity:.38}
.grid{margin-top:28px;display:grid;gap:10px}
.cardlink{display:block;padding:16px 18px;border-radius:13px;text-decoration:none;
          background:rgba(246,241,228,.055);border:1px solid rgba(246,241,228,.13)}
.cardlink:hover{background:rgba(246,241,228,.1)}
.cardlink .t{font-weight:600;font-size:17px}
.cardlink .s{font-size:12px;letter-spacing:.16em;margin-top:5px;opacity:.55}
</style>
<body style="--acc:#1C8B9C"><a class="home" href="index.html">&larr; Circle</a><div class="tag">ARAÇ</div><h1>Cevabını yaz</h1><p class="lede">Kağıt yerine burası. Cevabını yaz, ekranı kapat, herkes aynı anda açsın.</p><div id="yazma"><textarea id="alan" rows="4" placeholder="Cevabın…" style="margin-top:22px;width:100%;padding:18px;border-radius:14px;border:1px solid rgba(246,241,228,.2);background:rgba(246,241,228,.06);color:inherit;font:inherit;font-size:20px;resize:vertical"></textarea><button class="pick" id="bitti">Yazdım, kapat</button></div><div id="hazir" hidden><div id="out" style="display:block;margin-top:22px;text-align:center;padding:48px 20px"><div style="font-size:30px;font-weight:650">Hazır</div><div style="margin-top:8px;font-size:13px;opacity:.6">Herkes hazır olunca açın</div></div><button class="pick" id="ac">Göster</button><button class="pick" id="duzelt" style="background:rgba(246,241,228,.14);color:var(--cream)">Değiştir</button></div><div id="sonuc" hidden><div id="out2" style="margin-top:22px;text-align:center;padding:44px 20px;border-radius:14px;background:rgba(246,241,228,.07);border:1px solid rgba(246,241,228,.16)"><div id="cevap" style="font-size:28px;font-weight:650;line-height:1.3;word-break:break-word"></div></div><button class="pick" id="tekrar">Yeni tur</button></div><script>
const d=document;const g=i=>d.getElementById(i);
function gizle(){const v=g("alan").value.trim();if(!v)return;
 g("yazma").hidden=true;g("hazir").hidden=false;}
function goster(){g("hazir").hidden=true;g("sonuc").hidden=false;
 g("cevap").textContent=g("alan").value.trim();}
function yeni(){g("alan").value="";g("sonuc").hidden=true;g("hazir").hidden=true;
 g("yazma").hidden=false;g("alan").focus();}
d.addEventListener("DOMContentLoaded",()=>{
 g("bitti").onclick=gizle;g("ac").onclick=goster;g("tekrar").onclick=yeni;
 g("duzelt").onclick=()=>{g("hazir").hidden=true;g("yazma").hidden=false;g("alan").focus();};});
</script>
<div class="foot">Circle</div></body></html>
