<body style="--acc:#D4426E"><a class="home" href="index.html">&larr; Circle</a><div class="tag">SAHNE</div><h1>Boşluk doldurma</h1><p class="lede">Hakem cümleyi açar ve yüksek sesle okur. Herkes boşluğu dolduracak cevabını yazar, hakem hepsini karıştırıp okur ve birini seçer.</p><button class="pick" id="btn">Rastgele cümle</button><div id="out"></div><p class="lede" style="font-size:13px;margin-top:20px">Cevapları telefondan yazmak için <a href="yaz.html">cevabını yaz</a> ya da <a href="oda.html">ortak oda</a>.</p><script>const B=["Annem beni en çok ___ yaparken yakaladı.", "Hayatımın en kötü kararı: ___.", "İş görüşmesinde ___ deyince işe alınmadım.", "Türkiye'nin asıl sorunu ___.", "Doktor muayenede ___ görünce sustu.", "Yeni yıl kararım: ___.", "Mezar taşıma ___ yazsınlar.", "Çocukken ___ sanıyordum.", "Beni en çok ___ yaşlandırdı.", "Bu akşamın felaketi: ___.", "Asla ___ olan bir evde yaşayamam.", "Ailemin bana hâlâ hatırlattığı şey: ___.", "Arkadaşlıkların bittiği an: ___.", "Dünya ___ yüzünden batacak.", "Telefonumda kimsenin görmemesi gereken şey: ___.", "Romantik akşam yemeğinin ortasında ___.", "Patronumun odasında ___ buldum.", "Tatilden geriye kalan tek şey: ___.", "Benim süper gücüm ___ olurdu.", "Kimse bilmiyor ama ben ___.", "Düğünde yaşanan en büyük rezalet: ___.", "Sabah uyanınca ilk düşündüğüm şey: ___.", "Hayatımı kurtaran şey ___ oldu.", "Asansörde kalınca aklıma ilk ___ geldi.", "Komşularım beni ___ sanıyor.", "Son mesajımı ___ diye sildim.", "En büyük yeteneğim: ___.", "Bu kadar yorgun olmamın sebebi ___.", "Çocuğuma asla ___ demem.", "Kendime verdiğim en kötü söz: ___."];const o=document.getElementById("out");let son=-1;document.getElementById("btn").onclick=()=>{let i;do{i=Math.floor(Math.random()*B.length)}while(i===son);son=i;o.innerHTML=B[i];o.style.display="block";};</script>
