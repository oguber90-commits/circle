 "Ters çevrilir.", "İçinde kar yağar."]], ["Çamaşır makinesi", ["İlk modelleri elle çevriliyordu.", "Kadınların gününü değiştirdiği söylenir.", "Tek tek çorapları yutar.", "Sıkma yapar.", "Kirli giysileri yıkar."]], ["Fener", ["Denizcilerin yolunu buldurur.", "Kıyıda yüksek bir kuleden döner.", "Işığı kilometrelerce gider.", "Gemiler ona bakar.", "Kayalara çarpmayı önler."]], ["Yastık", ["İlki taştandı.", "Serin tarafı aranır.", "Kavgada silah olur.", "Kılıfı değiştirilir.", "Başın altına konur."]], ["Tebeşir", ["Milyonlarca yıllık deniz canlılarının kalıntısıdır.", "Tozu alerji yapar.", "Karatahtaya yazar.", "Kırılır.", "Okulda kullanılırdı."]], ["Patates", ["Avrupa'ya geldiğinde zehirli sanıldı.", "Bir ülkede kıtlığa adını verdi.", "Toprak altında büyür.", "Gözleri filizlenir.", "Kızartması yapılır."]], ["Asma kilit", ["Mezarlara bile takıldı.", "Köprü korkuluklarına asılır.", "Anahtarı kaybolursa kesilir.", "U şeklinde demiri vardır.", "Kilitler."]], ["Dürbün", ["İki teleskopun yan yana konmasıdır.", "Operada küçüğü kullanılır.", "Boyundan asılır.", "İki gözle bakılır.", "Uzağı yakın gösterir."]], ["Kaşık", ["En eskileri deniz kabuğuydu.", "Tahta olanı yemeği soğutur.", "Çatalla birlikte durur.", "Çukuru vardır.", "Çorba içilir."]], ["Baraj", ["Bir şehri sular altında bırakabilir.", "Elektrik üretir.", "Beton duvardan oluşur.", "Arkasında göl tutar.", "Suyu keser."]], ["Örgü", ["İki şişle ya da tığla yapılır.", "İlmek sayılır.", "Anneanne hediyesidir.", "Yünden olur.", "Kışın giyilir."]], ["Posta kutusu", ["Rengi ülkeden ülkeye değişir.", "Ağzı dar bir yarıktır.", "Sokak köşesinde durur.", "Günde bir boşaltılır.", "Mektup atılır."]]];
let set=null,sira=0,bitti=false;const d=document;
let it=[];
function cekI(){if(!it.length){it=I.map((_,i)=>i);
 for(let i=it.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[it[i],it[j]]=[it[j],it[i]];}}return it.pop();}
function yeniSet(){set=I[cekI()];sira=0;bitti=false;
 d.getElementById("liste").innerHTML="";d.getElementById("cevap").innerHTML="";}
function ilerle(){
 if(set===null||bitti){yeniSet();}
 const n=set[1].length;
 if(sira<n){const puan=n-sira;sira++;
  d.getElementById("liste").insertAdjacentHTML("beforeend",

 d.getElementById("cevap").innerHTML="Cevap: <b>"+set[0]+"</b>";bitti=true;
 d.getElementById("btn").textContent="Yeni tur";}
