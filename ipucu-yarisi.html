<body style="--acc:#E0632F"><a class="home" href="index.html">&larr; Circle</a><div class="tag">BECERİ</div><h1>İpucu yarışı</h1><p class="lede">İpuçları birer birer açılır ve gittikçe kolaylaşır. İlk bilen o ipucunun puanını alır. Cevap en sonda görünür, telefonu tutan kişi de oynayabilir.</p><button class="pick" id="btn">İlk ipucunu göster</button><ul id="liste" style="margin-top:22px"></ul><div id="cevap" style="margin-top:22px;font-size:22px"></div><script>const I=[["Pusula", ["İlk biçimi bir kaşıktı.", "Manyetik alanla çalışır.", "Denizciliği baştan değiştirdi.", "İğnesi hep bir yönü gösterir.", "Kuzeyi bulmaya yarar."]], ["Ayna", ["İlki parlatılmış taştı.", "Vampirler onu sevmez.", "Işığı geri gönderir.", "Banyoda buğulanır.", "Kendine bakarsın."]], ["Sabun", ["Kül ve yağdan yapılırdı.", "Suyun yüzey gerilimini düşürür.", "Halep onunla ünlüdür.", "Elden kayar.", "Köpürür ve temizler."]], ["Pamuk", ["Bir dönem savaş sebebi oldu.", "Tohumundan yağ çıkar.", "Tarlada beyaz açar.", "Tişörtün çoğu ondan.", "Yumuşaklığıyla anılır."]], ["Deve", ["Hörgücünde su değil yağ taşır.", "Kirpikleri üç sıradır.", "Tükürmesiyle ünlüdür.", "Günlerce susuz durur.", "Çölün gemisi denir."]], ["Buz", ["Suyun katı hali ama daha hafif.", "Dağları aşındırır.", "Titanik ona çarptı.", "Bardakta şıngırdar.", "Donunca oluşur."]], ["Tuz", ["Bir zamanlar maaş olarak verildi.", "Yolları üzerine kuruldu.", "Yarası olan ondan kaçar.", "Denizden ve madenden çıkar.", "Yemeğe atılır."]], ["Gitar", ["Atası uttur.", "Gövdesi sesi büyütür.", "Parmak uçlarını nasırlaştırır.", "Altı teli vardır.", "Çalınır ve akort edilir."]], ["Telefon", ["İlk versiyonunda numara çevrilirdi.", "Patenti tartışmalıdır.", "Artık en az kullanılan özelliği arama.", "Cebe girer.", "Şarj ister."]], ["Şemsiye", ["Önce güneşten korunmak için yapıldı.", "Statü göstergesiydi.", "Rüzgarda ters döner.", "Taksiye binince unutulur.", "Yağmurda açılır."]], ["Yumurta", ["Dışarıdan kırılırsa yemek, içeriden kırılırsa hayat olur.", "Kabuğu kireçtir.", "Sarısı ve beyazı ayrılır.", "Kahvaltının klasiği.", "Tavuk yapar."]], ["Saat kulesi", ["Meydanların ortasında durur.", "Osmanlı'da çok sayıda dikildi.", "Tepesinde çan olur.", "Uzaktan görülsün diye yüksektir.", "Zamanı gösterir."]], ["Fil", ["Hafızasıyla anılır.", "Ayaklarıyla titreşim duyar.", "Zıplayamayan tek memeli.", "Hortumuyla su çeker.", "Kara hayvanlarının en irisi."]], ["Köprü", ["En eskileri taş kemerlidir.", "Asker adımıyla geçilmez.", "İki yakayı birleştirir.", "Altından su akar.", "Üstünden geçersin."]], ["Çay", ["Bir kaza sonucu bulunduğu söylenir.", "Bir limanda denize döküldü.", "Rize'de yetişir.", "İnce belli bardakta içilir.", "Demlenir."]], ["Ateş", ["İnsanı insan yapan şey denir.", "Oksijensiz yaşayamaz.", "Mağara duvarına gölge düşürdü.", "Odunla beslenir.", "Isıtır ve yakar."]], ["Harita", ["Eskiden ejderhalar çizilirdi.", "Küreyi düzleme sığdırmak imkansızdır.", "Ölçeği vardır.", "Katlanır.", "Yol bulmaya yarar."]], ["Ekmek", ["Mayası tesadüfen keşfedildi.", "Fiyatı devrim başlattı.", "Bayatlayınca taş olur.", "Fırında pişer.", "Her sofrada bulunur."]], ["Kalem", ["İçindeki siyah şey kurşun değildir.", "Uzayda sorun çıkardı.", "Arkasında silgisi olur.", "Açacakla sivriltilir.", "Yazmaya yarar."]], ["Tren", ["Raylarının genişliği at arabasından kalma.", "İlk yolcuları hız korkusu yaşadı.", "Vagonları peş peşe dizilir.", "Düdüğü duyulur.", "Garda durur."]], ["Uçurtma", ["Bir bilim deneyinde kullanıldı.", "Asya'da savaş işareti olarak uçuruldu.", "Kuyruğu denge verir.", "İpi elinde kalır.", "Rüzgarda uçar."]], ["Ayakkabı", ["Sağ ve solu uzun süre aynıydı.", "Çifti bağlanır.", "Mağazada denenir.", "Tabanı aşınır.", "Ayağa giyilir."]], ["Piyano", ["Adı yumuşak ve yüksek demektir.", "İçinde çekiçler var.", "Siyah ve beyaz tuşlar.", "Akortçu ister.", "Parmakla çalınır."]], ["Gözlük", ["İlk camları Venedik'te yapıldı.", "Burnun üstünde durur.", "Buğulanır.", "Çerçevesi vardır.", "Görmeyi düzeltir."]], ["Kar", ["İki tanesi birbirinin aynısı değildir.", "Sesi yutar.", "Kürekle atılır.", "Okulları tatil eder.", "Beyaz yağar."]], ["Bal", ["Doğru saklanırsa bozulmaz.", "Mezarlarda bulundu.", "Peteklerde birikir.", "Kaşıkla akar.", "Arılar yapar."]], ["Zeytin", ["Ağacı bin yıl yaşar.", "Dalı barış demektir.", "Salamurada bekler.", "Yağı çıkarılır.", "Kahvaltıda yenir."]], ["Radyo", ["İlk yayını gemiden yapıldı.", "Savaşta en güçlü araçtı.", "Frekansı ayarlanır.", "Arabada açılır.", "Sesi vardır, görüntüsü yok."]], ["Merdiven", ["Altından geçmek uğursuz sayılır.", "Basamakları eşit olmak zorunda.", "İtfaiye aracında uzar.", "Yorar.", "Yukarı çıkarır."]], ["Kaplumbağa", ["Kabuğu iskeletinin parçasıdır.", "Yüz yıldan fazla yaşar.", "Masalda tavşanı yener.", "Yavaş yürür.", "Kabuğuna çekilir."]], ["Türk kahvesi", ["Kahve falı ondan bakılır.", "Cezvede pişer.", "Köpüğü makbuldür.", "Telvesi dibe çöker.", "Türk usulü denir."]], ["Saç kurutma makinesi", ["İlk modeli süpürgeye bağlanıyordu.", "Sigortayı attırır.", "Gürültülüdür.", "Sıcak hava üfler.", "Banyodan sonra kullanılır."]], ["Kibrit", ["İlk hali kendiliğinden tutuşuyordu.", "Kutunun yanına sürtülür.", "Başı kırmızıdır.", "Islanınca işe yaramaz.", "Ateş yakar."]], ["Asansör", ["Güvenlik freni icat edilince gökdelenler yükseldi.", "İçinde ayna olur.", "Düğmesine basılır.", "Kalabalıkta sessizleşilir.", "Katlar arası taşır."]], ["Pencere", ["Vergisi yüzünden örülenler oldu.", "Camı eskiden çok pahalıydı.", "Perdesi çekilir.", "Dışarıyı gösterir.", "Açılıp havalandırılır."]], ["Satranç saati", ["İki kadran yan yanadır.", "Birine basınca öbürü başlar.", "Turnuvada zorunludur.", "Süreyi böler.", "Oyuncuyu acele ettirir."]]];
let set=null,sira=0,bitti=false;const d=document;
function yeniSet(){set=I[Math.floor(Math.random()*I.length)];sira=0;bitti=false;
 d.getElementById("liste").innerHTML="";d.getElementById("cevap").innerHTML="";}
function ilerle(){
 if(set===null||bitti){yeniSet();}
 const n=set[1].length;
 if(sira<n){const puan=n-sira;sira++;
  d.getElementById("liste").insertAdjacentHTML("beforeend",
   "<li><b>"+puan+" puan</b> &nbsp; "+set[1][sira-1]+"</li>");
  d.getElementById("btn").textContent=sira<n?"Sonraki ipucu":"Cevabı göster";return;}
 d.getElementById("cevap").innerHTML="Cevap: <b>"+set[0]+"</b>";bitti=true;
 d.getElementById("btn").textContent="Yeni tur";}
d.addEventListener("DOMContentLoaded",()=>{d.getElementById("btn").onclick=ilerle;});
</script>
