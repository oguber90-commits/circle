<!doctype html><html lang="tr"><meta charset="utf-8">

<title>Hangisi gerçek · Circle</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111A24;--cream:#F6F1E4;--acc:#1C8B9C}
body{background:var(--ink);color:var(--cream);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     -webkit-font-smoothing:antialiased;padding:28px 20px 72px;max-width:720px;margin:0 auto}
a{color:inherit}
.home{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.22em;
      opacity:.55;text-decoration:none}
.home:hover{opacity:1}
.tag{display:block;margin-top:26px;font-size:11px;letter-spacing:.2em;
     color:var(--acc);font-weight:600}
h1{font-size:clamp(28px,8vw,40px);line-height:1.08;letter-spacing:-.02em;font-weight:650;margin-top:10px}
.lede{margin-top:14px;opacity:.72;max-width:46ch}
.pick{width:100%;margin-top:26px;padding:16px;border:0;border-radius:14px;background:var(--acc);
      color:#0B1118;font:inherit;font-weight:650;letter-spacing:.01em;cursor:pointer}
.pick:active{transform:translateY(1px)}
#out{display:none;margin-top:16px;padding:20px;border-radius:14px;background:rgba(246,241,228,.07);
     border:1px solid rgba(246,241,228,.16);font-size:20px;line-height:1.35}
h2{margin-top:40px;font-size:12px;letter-spacing:.2em;opacity:.5;font-weight:600}
ul{list-style:none;margin-top:12px}
li{padding:12px 0;border-bottom:1px solid rgba(246,241,228,.11)}
li:last-child{border-bottom:0}
b{font-weight:650;color:#fff}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid rgba(246,241,228,.12);font-size:12px;
      letter-spacing:.2em;opacity:.38}
.grid{margin-top:28px;display:grid;gap:10px}
.cardlink{display:block;padding:16px 18px;border-radius:13px;text-decoration:none;
          background:rgba(246,241,228,.055);border:1px solid rgba(246,241,228,.13)}
.cardlink:hover{background:rgba(246,241,228,.1)}
.cardlink .t{font-weight:600;font-size:17px}
.cardlink .s{font-size:12px;letter-spacing:.16em;margin-top:5px;opacity:.55}
</style>
<body style="--acc:#6F65C9"><a class="home" href="index.html">&larr; Circle</a><div class="tag">BLÖF</div><h1>Hangisi gerçek</h1><p class="lede">Moderatör başlıkları sırayla açar. Üçü de okununca herkes tahminini yazar, sonra gerçek açıklanır.</p><button class="pick" id="btn">İlk başlığı göster</button><ul id="liste" style="margin-top:22px"></ul><div id="cevap" style="margin-top:22px;font-size:19px"></div><script>const S=[["Avustralya ordusu emulara karşı savaş açtı ve kaybetti", "Yeni Zelanda koyunlara kimlik numarası verdi", "Kanada kunduzlara resmi geçiş hakkı tanıdı"], ["Bir ülke tarih çizgisinin öbür tarafına geçerek takviminden bir günü tamamen sildi", "Bir şehir pazartesileri resmen yasakladı", "Bir ada yılbaşını iki kez kutlamakla yükümlü"], ["Tarihin en kısa savaşı yaklaşık kırk dakika sürdü", "Bir ülke savaşı kura çekerek bitirdi", "İki ülke barışı futbol maçıyla ilan etti"], ["Bir müzeye teslim edilen eser bomboş iki tuval olarak çıktı ve sergilendi", "Bir müzede tabloları ziyaretçiler asıyor", "Bir galeride eserler her gün yer değiştiriyor"], ["Eyfel Kulesi sıcakta genleşip on beş santime kadar uzayabiliyor", "Eyfel Kulesi kışın rüzgârda ıslık çalıyor", "Eyfel Kulesi'nin rengi her yıl değiştiriliyor"], ["Bir kedi bir kasabada yıllarca fahri belediye başkanı oldu", "Bir köpek okul müdürü seçildi", "Bir papağan mahkemede tanık olarak dinlendi"], ["Okyanusta karaya en uzak noktanın adı Nemo Noktası", "Dünyanın en sessiz adası satışa çıkarıldı", "Pasifik'te hâlâ adı konmamış bir ada var"], ["Bal doğru saklandığında binlerce yıl bozulmadan kalabiliyor", "Zeytinyağı buzdolabında taşa dönüşüyor", "Tuzun tadı belli bir yaştan sonra kayboluyor"], ["Bir kişi yıldırım çarpmasından yedi kez sağ kurtuldu", "Bir köy kırk yıl boyunca hiç yağmur görmedi", "Bir kasabada her yıl aynı gün dolu yağıyor"], ["Ahtapotların üç kalbi vardır", "Zürafaların iki midesi vardır", "Develerin göz kapağı yoktur"], ["Bir ülkede bebeklere isim verirken resmi listeden seçme zorunluluğu var", "Bir ülkede soyadı iki kelimeden uzun olamaz", "Bir ülkede isim değiştirmek ömürde bir kez mümkün"], ["Antarktika'da hiçbir ülkenin resmi saat dilimi geçerli değil", "Antarktika'nın posta kodu yok", "Antarktika'da hiç yağmur yağmamıştır"], ["Uzayda uzun süre kalan astronotların boyu geçici olarak uzar", "Uzayda yüksek sesle konuşmak yasaktır", "Uzay istasyonunda saat günde iki kez durdurulur"], ["Bazı ülkelerde sakız satmak uzun yıllar yasaktı", "Bazı ülkelerde kahve içmek izne bağlıydı", "Bazı ülkelerde şemsiye taşımak yasaktı"], ["Bir sanat eseri açık artırmada satıldıktan hemen sonra kendi kendini parçaladı", "Bir heykeltıraş eserini müzeye kilitleyip anahtarı denize attı", "Bir yazar kitabının tek nüshasını gömdü"], ["Dünyanın en eski çalışan oteli bin yıldan uzun süredir açık", "Dünyanın en eski restoranı her gün aynı yemeği çıkarıyor", "Dünyanın en eski kafesi ilk fincanını hâlâ saklıyor"], ["Bir ülkede koyun sayısı insan sayısının birkaç katıdır", "Bir ülkede her vatandaşa doğduğunda bir ağaç kaydedilir", "Bir ülkede evcil hayvan sayısı nüfusun iki katıdır"], ["Bir futbol maçı yoğun sis yüzünden oyuncular farkında olmadan sürdü", "Bir maç seyircilerin uyuması yüzünden ertelendi", "Bir maçta top kaybolduğu için beraberlik ilan edildi"], ["Muz botanik olarak bir çeşit meyve, çilek ise değil", "Çilek aslında bir sebzedir", "Karpuz botanik olarak bir tahıldır"], ["Bir ülkenin milli marşının resmi sözü yoktur", "Bir ülkenin marşı sadece kışın çalınır", "Bir ülkenin birbirinden bağımsız iki marşı vardır"], ["Bir şehirde güvercin beslemek belediye iznine tabidir", "Bir şehirde kedi beslemek kayda bağlıdır", "Bir şehirde köpek havlaması saatle sınırlıdır"], ["Bir ülkede trafik ışıkları olmayan bir başkent bulunuyordu", "Bir ülkede araba renkleri devletçe belirleniyor", "Bir ülkede korna çalmak tamamen yasak"], ["Dünyanın en uzun tarifeli uçuşu on sekiz saati aşıyor", "Bir havayolu yolcularına uyku garantisi veriyor", "Bir uçakta kütüphane bölümü açıldı"], ["Bir kütüphanede yüz yıldan uzun süredir iade edilmeyen kitaplar var", "Bir kütüphane kitapları sadece yağmurlu günlerde veriyor", "Bir kütüphanede kitaplar ağırlıkla ödünç veriliyor"]];
let set=null,sira=0,duzen=[];const d=document;
function yeniSet(){const i=Math.floor(Math.random()*S.length);set=S[i];
 duzen=[0,1,2].sort(()=>Math.random()-0.5);sira=0;
 d.getElementById("liste").innerHTML="";d.getElementById("cevap").innerHTML="";}
function ilerle(){
 if(set===null||(sira>=3&&d.getElementById("cevap").innerHTML)){yeniSet();}
 if(sira<3){const idx=duzen[sira];sira++;
  d.getElementById("liste").insertAdjacentHTML("beforeend","<li><b>"+sira+".</b> "+set[idx]+"</li>");
  d.getElementById("btn").textContent=sira<3?"Sonraki başlık":"Gerçeği göster";return;}
 const yer=duzen.indexOf(0)+1;
 d.getElementById("cevap").innerHTML="Gerçek olan: <b>"+yer+". başlık</b>";
 d.getElementById("btn").textContent="Yeni set";}
d.addEventListener("DOMContentLoaded",()=>{d.getElementById("btn").onclick=ilerle;});
</script>
